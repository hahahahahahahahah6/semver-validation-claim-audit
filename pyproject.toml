[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semver-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documentation claims against Python source"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
semver-validation-claim-audit = "semver_validation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["semver_validation_claim_audit*", "tests*"]
